<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P.5 Dictation (2) - 挑戰網頁</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background-color: #fdf2f8; /* 淺粉色背景 */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-sizing: border-box;
            border: 4px solid #f472b6; 
        }
        h1, h2 { text-align: center; color: #db2777; margin-bottom: 10px; }
        .part-section {
            margin-bottom: 25px;
            padding: 15px;
            background-color: #fffaf0;
            border-radius: 15px;
            border: 2px dashed #f97316;
        }
        .btn {
            background-color: #ec4899;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .input-group { margin-bottom: 8px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #fbcfe8;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .status {
            font-size: 14px;
            color: #be185d;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            min-height: 1.2em;
        }
        #score-page { display: none; text-align: center; }
        .score-display { font-size: 40px; font-weight: bold; color: #db2777; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container" id="main-page">
    <p style="text-align: center; color: #666; font-size: 14px;">Ta Ku Ling Ling Ying Public School</p>
    <h1>📝 P.5 Dictation (2) 📝</h1>
    
    <div class="part-section">
        <h2>A. Vocabulary (40%)</h2>
        <button class="btn" id="btn-A" onclick="playWords('A', dictationData.partA)">🔊 播放 Part A (讀2次，隔20秒)</button>
        <div class="status" id="status-A"></div>
        <div id="inputs-A"></div>
    </div>

    <div class="part-section">
        <h2>B1. Seen Paragraphs (40%)</h2>
        <button class="btn" id="btn-B1" onclick="playSentences('B1', dictationData.partB1)">🔊 播放 Part B1 (半句讀2次，隔10秒)</button>
        <div class="status" id="status-B1"></div>
        <div id="inputs-B1"></div>
    </div>

    <div class="part-section">
        <h2>B2. Recite Dictation (20%)</h2>
        <button class="btn" id="btn-B2" onclick="playSentences('B2', dictationData.partB2)">🔊 播放 Part B2 (半句讀2次，隔10秒)</button>
        <div class="status" id="status-B2"></div>
        <div id="inputs-B2"></div>
    </div>

    <div class="part-section">
        <h2>C. Fun Dictation</h2>
        <button class="btn" id="btn-C" onclick="playWords('C', dictationData.partC)">🔊 播放 Part C (讀2次，隔20秒)</button>
        <div class="status" id="status-C"></div>
        <div id="inputs-C"></div>
    </div>

    <button class="btn" style="background-color: #10b981; font-size: 20px;" onclick="submitDictation()">✅ 完成交卷</button>
</div>

<div class="container" id="score-page">
    <h1>🎉 挑戰完成 🎉</h1>
    <div id="display-datetime" style="margin-bottom: 10px; color: #666;"></div>
    <div class="score-display">得分: <span id="final-score">0</span> / <span id="total-items">0</span></div>
    <div id="mistakes-log" style="text-align: left; background: #fdf2f8; padding: 15px; border-radius: 10px; margin-top: 10px; font-size: 14px;"></div>
    <button class="btn" style="margin-top:20px;" onclick="location.reload()">🔄 重新挑戰</button>
</div>

<script>
    const dictationData = {
        partA: [
            "have barbecues", "play badminton", "go hiking", "go cycling", 
            "go ice skating", "bake pies", "attend gymnastic classes", "sing in a choir", 
            "do karate", "do fencing", "watch films", "leisure", 
            "activities", "wonderful", "seldom"
        ],
        partB1: [
            { half1: "There is no right or wrong way to eat.", half2: "It all depends on your culture." },
            { half1: "However, you have to respect ", half2: "other people's customs." },
            { half1: "When you eat noodles in Japan,", half2: "you have to make a loud slurping noise" },
            { half1: "so that the chef ", half2: "would feel that you like the food." },
            { half1: "Jayden and his mother went to ", half2: "an American restaurant last night." },
            { half1: "Jayden looked at the menu ", half2: "and told his mother," },
            { half1: "'I'd prefer the garden salad ", half2: "to the vegetable soup.'" },
            { half1: "He would like the roast chicken as his main course ", half2: "and cheesecake as his dessert." }
        ],
        partB2: [
            { half1: "Which starter would you prefer?", half2: "I'd prefer the fried fish to the sausage rolls." },
            { half1: "How are the fried noodles?", half2: "They're too oily." }
        ],
        partC: ["potato salad", "garden salad", "grilled steak with rice", "Buffalo wings"]
    };

    function renderInputs() {
        const draw = (data, id, prefix) => {
            const container = document.getElementById(id);
            data.forEach((_, i) => {
                container.innerHTML += `<div class="input-group"><input type="text" id="${prefix}-${i}" placeholder="答案 ${i+1}"></div>`;
            });
        };
        draw(dictationData.partA, 'inputs-A', 'input-A');
        draw(dictationData.partB1, 'inputs-B1', 'input-B1');
        draw(dictationData.partB2, 'inputs-B2', 'input-B2');
        draw(dictationData.partC, 'inputs-C', 'input-C');
    }
    renderInputs();

    const speak = (text) => {
        return new Promise((resolve) => {
            window.speechSynthesis.cancel(); 
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = 0.8;
            utter.onend = () => resolve();
            utter.onerror = () => resolve();
            window.speechSynthesis.speak(utter);
        });
    };

    const wait = (ms) => new Promise(res => setTimeout(res, ms));

    async function playWords(id, data) {
        const btn = document.getElementById(`btn-${id}`);
        const status = document.getElementById(`status-${id}`);
        btn.disabled = true;

        for (let i = 0; i < data.length; i++) {
            status.innerText = `[${i+1}/${data.length}] 正在讀第一次...`;
            await speak(data[i]);
            for (let s = 20; s > 0; s--) {
                status.innerText = `[${i+1}/${data.length}] 等待第二次 (${s}s)`;
                await wait(1000);
            }
            status.innerText = `[${i+1}/${data.length}] 正在讀第二次...`;
            await speak(data[i]);
            await wait(2000);
        }
        status.innerText = "本部分播放完畢！";
        btn.disabled = false;
    }

    async function playSentences(id, data) {
        const btn = document.getElementById(`btn-${id}`);
        const status = document.getElementById(`status-${id}`);
        btn.disabled = true;
        let full = "";

        for (let i = 0; i < data.length; i++) {
            full += data[i].half1 + " " + data[i].half2 + " ";
            // 前半句
            status.innerText = `[句${i+1}] 前半：第一次`;
            await speak(data[i].half1);
            for(let s=10; s>0; s--) { status.innerText = `[句${i+1}] 前半等待 (${s}s)`; await wait(1000); }
            status.innerText = `[句${i+1}] 前半：第二次`;
            await speak(data[i].half1);
            await wait(2000);

            // 後半句
            status.innerText = `[句${i+1}] 後半：第一次`;
            await speak(data[i].half2);
            for(let s=10; s>0; s--) { status.innerText = `[句${i+1}] 後半等待 (${s}s)`; await wait(1000); }
            status.innerText = `[句${i+1}] 後半：第二次`;
            await speak(data[i].half2);
            await wait(2000);
        }
        status.innerText = "現在重讀全文...";
        await speak(full);
        status.innerText = "播放完畢！";
        btn.disabled = false;
    }

    function clean(str) { return str.toLowerCase().replace(/[.,!?;:'"’]/g, "").trim(); }

    function submitDictation() {
        let score = 0;
        let total = 0;
        let mistakesHtml = "<strong>需要複習：</strong><ul>";

        const check = (data, prefix, isSent = false) => {
            data.forEach((ans, i) => {
                total++;
                let userVal = document.getElementById(`input-${prefix}-${i}`).value;
                let target = isSent ? (ans.half1 + " " + ans.half2) : ans;
                if(clean(userVal) === clean(target)) {
                    score++;
                } else {
                    mistakesHtml += `<li>${prefix} ${i+1}: 正確為 "${target}"</li>`;
                }
            });
        };

        check(dictationData.partA, 'A');
        check(dictationData.partB1, 'B1', true);
        check(dictationData.partB2, 'B2', true);
        check(dictationData.partC, 'C');

        mistakesHtml += "</ul>";
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('score-page').style.display = 'block';
        document.getElementById('final-score').innerText = score;
        document.getElementById('total-items').innerText = total;
        document.getElementById('display-datetime').innerText = "挑戰時間：" + new Date().toLocaleString('zh-HK');
        document.getElementById('mistakes-log').innerHTML = score === total ? "✨ 滿分！你太強了！" : mistakesHtml;
    }
</script>

</body>
</html>
